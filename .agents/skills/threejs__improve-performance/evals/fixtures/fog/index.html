<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FOG MACHINE™</title>
<style>
  :root{ --ink:#efe3f4; --pill-bg:rgba(18,11,24,.55); --pill-br:rgba(255,255,255,.16); }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#241633; overscroll-behavior:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; }
  canvas{ display:block; touch-action:none; }
  #ui{ position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; }
  #brand{ color:var(--ink); text-shadow:0 1px 6px rgba(20,8,30,.6); user-select:none; }
  #brand h1{ font-size:15px; font-weight:800; letter-spacing:.14em; }
  #brand .sub{ font-size:10px; font-weight:600; letter-spacing:.18em; opacity:.62; margin-top:2px; text-transform:uppercase; }
  #forecast{ font-size:11px; font-weight:600; opacity:.85; margin-top:9px; letter-spacing:.02em; transition:opacity .4s; }
  #perf{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; color:var(--ink); opacity:.7;
         background:var(--pill-bg); border:1px solid var(--pill-br); border-radius:99px; padding:5px 10px;
         backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); user-select:none; }
  #pills{ display:flex; gap:8px; justify-content:center; pointer-events:auto; }
  .pill{ font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--ink); background:var(--pill-bg);
         border:1px solid var(--pill-br); border-radius:99px; padding:12px 16px; cursor:pointer;
         backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); user-select:none;
         transition:transform .12s, background .25s, color .25s; }
  .pill:active{ transform:scale(.94); }
  .pill.on{ background:var(--ink); color:#1d1126; border-color:transparent; }
  #hint{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 74px); text-align:center;
         color:var(--ink); font-size:10px; font-weight:600; letter-spacing:.14em; opacity:.55;
         text-transform:uppercase; pointer-events:none; transition:opacity 1s; }
</style>
</head>
<body>
<div id="ui">
  <div class="row">
    <div id="brand">
      <h1>FOG MACHINE™</h1>
      <div class="sub">atmospheric department</div>
      <div id="forecast">forecast: aggressively purple</div>
    </div>
    <div id="perf">— ms</div>
  </div>
  <div id="pills">
    <button class="pill on" data-p="valsharah">VAL'SHARAH</button>
    <button class="pill" data-p="clearing">CLEARING</button>
  </div>
</div>
<div id="hint">drag to look</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ============================================================================
// TUNE — every knob lives here
// ============================================================================
const TUNE = {
  render: { maxDPR: 1.5, fov: 62, near: 0.1, far: 220, glow: 0.45, startTier: 1 },
  camera: { radius: 8.4, height: 2.0, targetY: 2.3, yaw0: 0.55, pitch0: 0.10,
            pitchMin: -0.12, pitchMax: 0.42, idleDrift: 0.045, idleAfter: 3.0,
            dragSens: 0.0042, damp: 6.0 },
  fog: {
    noiseScale: 0.014,     // repeats-per-meter into the baked cloud texture
    noiseNear: 2.5,        // banding fades in between these camera distances
    noiseFar: 11.0,        // (keeps the foreground from shimmering)
    dither: 0.012,         // interleaved-gradient-noise amplitude (kills banding)
  },
  motes:  { count: 140, box: 24, size: 26.0, drift: 0.25 },
  sheets: { banks: 14, mist: 3, bankBox: 64, mistBox: 44 },
  flames: [ { x: -1.62, y: 1.32, z: 0.86 }, { x: 1.62, y: 1.32, z: 0.86 } ],
  flame:  { coreSize: 0.34, haloSize: 0.85, haloGrow: 0.16, haloFade: 0.10 },
  lerpRate: 2.6,           // preset crossfade speed
  seed: 1337,

  presets: {
    valsharah: {
      forecast: 'forecast: aggressively purple',
      fogC: 0x8062ae, density: 0.120, falloff: 0.028, floor: 0.0, start: 8.0, lift: 1.0,
      noiseAmp: 0.62, windX: 0.65, windY: 0.26, fogNear: 0x584092, banks: 1.0, mist: 0.55,
      sunDir: [-0.52, 0.42, -0.55], sunC: 0xffd6f0, sunPow: 6.0, sunGain: 0.45,
      zenC: 0x3f2f6b, hemiSky: 0x7c66a4, hemiGnd: 0x20291f, hemiI: 0.62,
      dirC: 0xdcb8ea, dirI: 0.55, motes: 1.0,
    },
    clearing: {
      forecast: 'forecast: fine. suspiciously fine.',
      fogC: 0xd9aec6, density: 0.022, falloff: 0.13, floor: -0.5, start: 10.0, lift: 0.0,
      noiseAmp: 0.65, windX: 0.35, windY: 0.15, fogNear: 0xcf9dbb, banks: 0.35, mist: 1.0,
      sunDir: [-0.75, 0.18, -0.35], sunC: 0xffdfc0, sunPow: 11.0, sunGain: 0.9,
      zenC: 0x7c66a8, hemiSky: 0xc79ab4, hemiGnd: 0x27301f, hemiI: 0.9,
      dirC: 0xffd9b8, dirI: 0.65, motes: 0.55,
    },
  },
};

// ============================================================================
// Seeded RNG — deterministic scene every load
// ============================================================================
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rng = mulberry32(TUNE.seed);

// ============================================================================
// NOISE TEXTURE — the actual WoW move. Mist cards in 2005 engines sampled a
// small pre-rendered cloud texture, not live noise: 7 octaves of fractal
// character baked offline, then bilinear-stretched huge = rich AND soft.
// Baked once at boot (~40ms), seeded, tileable. RGB = three characters:
//   R: domain-warped fBm with a painted S-curve (mist body)
//   G: billow/turbulence (tendrils, wisp detail)
//   B: two fat octaves only (broad variation, drives the distance-fog banks)
// ============================================================================
const NOISE_TEX = (() => {
  const S = 256, OCT = 7, rand = mulberry32((TUNE.seed ^ 0x9e3779b9) >>> 0);
  const tabs = [];
  for (let o = 0; o < OCT; o++){
    const f = 4 << o, t = new Float32Array(f * f);
    for (let i = 0; i < f * f; i++) t[i] = rand();
    tabs.push({ f, t });
  }
  const sm = x => x * x * (3 - 2 * x);
  function val(o, x, y){                       // periodic value noise → tiles
    const { f, t } = tabs[o];
    const gx = ((x % 1) + 1) % 1 * f, gy = ((y % 1) + 1) % 1 * f;
    const ix = Math.floor(gx), iy = Math.floor(gy);
    const fx = sm(gx - ix), fy = sm(gy - iy);
    const i0 = ix % f, i1 = (ix + 1) % f, j0 = iy % f, j1 = (iy + 1) % f;
    const a = t[j0 * f + i0], b = t[j0 * f + i1], c = t[j1 * f + i0], d = t[j1 * f + i1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const cx = cv.getContext('2d'), img = cx.createImageData(S, S);
  const FN = (1 - Math.pow(0.55, OCT)) / (1 - 0.55) * 0.5;   // fbm norm
  const BN = (1 - Math.pow(0.50, OCT)) / (1 - 0.50) * 0.5;   // billow norm
  for (let y = 0; y < S; y++){
    for (let x = 0; x < S; x++){
      const u = x / S, v = y / S;
      const wx = val(1, u + 0.37, v) - 0.5, wy = val(1, u, v + 0.71) - 0.5;
      const uu = u + wx * 0.07, vv = v + wy * 0.07;
      let fbm = 0, bil = 0, a = 0.5, b = 0.5;
      for (let o = 0; o < OCT; o++){
        const n = val(o, uu, vv);
        fbm += n * a;                 a *= 0.55;
        bil += (1 - Math.abs(2 * n - 1)) * b; b *= 0.50;
      }
      fbm /= FN; bil /= BN;
      const body = sm(Math.min(1, Math.max(0, (fbm - 0.18) / 0.64)));   // painted S-curve
      const big  = val(0, u, v) * 0.6 + val(1, u, v) * 0.4;
      const k = (y * S + x) * 4;
      img.data[k]     = body * 255;
      img.data[k + 1] = bil * bil * 255;
      img.data[k + 2] = big * 255;
      img.data[k + 3] = 255;
    }
  }
  cx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  return tex;
})();
const rr = (a,b)=>a+(b-a)*rng();
const smooth=(a,b,x)=>{ const t=Math.max(0,Math.min(1,(x-a)/(b-a))); return t*t*(3-2*t); };

// cheap JS value-noise for terrain (doesn't need to match the GPU)
function vhash(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoiseJS(x,y){ const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return vhash(ix,iy)*(1-u)*(1-v)+vhash(ix+1,iy)*u*(1-v)+vhash(ix,iy+1)*(1-u)*v+vhash(ix+1,iy+1)*u*v; }
function fbmJS(x,y){ return 0.62*vnoiseJS(x,y)+0.38*vnoiseJS(x*2.3+7.7,y*2.3+3.1); }

// terrain: dead flat in the clearing, gentle swells beyond — splashes rely on this
function terrainH(x,z){
  const r=Math.hypot(x,z);
  const mask=smooth(10.0, 16.0, r);
  return (fbmJS(x*0.09+31, z*0.09+17)-0.5)*2.6*mask;
}

// ============================================================================
// GLOBAL FOG CHUNK PATCH — the whole trick, part 1.
// Replaces three.js fog on EVERY built-in material with:
//   • closed-form exponential HEIGHT fog (Inigo Quilez integral — no marching)
//   • light inscatter toward the sun/moon (fog brightens facing the light)
//   • scrolling 2-octave value noise on density (the "breathing" murk)
//   • interleaved-gradient-noise dither (no banding in the flats)
// Zero extra passes. Zero depth reads. ~a dozen ALU per fragment.
// ============================================================================
const FOG_SHARED = {
  uFmTime:      { value: 0 },
  uFmSunDir:    { value: new THREE.Vector3(-0.52, 0.42, -0.55).normalize() },
  uFmSunCol:    { value: new THREE.Color(0xffd6f0) },
  uFmSunPow:    { value: 6.0 },
  uFmSunGain:   { value: 0.55 },
  uFmFalloff:   { value: 0.028 },
  uFmFloor:     { value: 0.0 },
  uFmNoiseAmp:  { value: 0.45 },
  uFmNoiseScale:{ value: TUNE.fog.noiseScale },
  uFmNoiseTex:  { value: NOISE_TEX },
  uFmWind:      { value: new THREE.Vector2(0.55, 0.22) },
  uFmFogNear:   { value: new THREE.Color(0x5e4685) },
  uFmStart:     { value: 8.0 },
  uFmLift:      { value: 1.0 },
};

const FOG_GLSL_COMMON = `
  float fmHash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
  float fmNoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(fmHash(i),fmHash(i+vec2(1.,0.)),f.x), mix(fmHash(i+vec2(0.,1.)),fmHash(i+vec2(1.,1.)),f.x), f.y); }
  float fmFbm(vec2 p){ return 0.62*fmNoise(p) + 0.38*fmNoise(p*2.3+13.7); }
  float fmIGN(vec2 px){ return fract(52.9829189*fract(dot(px, vec2(0.06711056,0.00583715)))); }
`;

THREE.ShaderChunk.fog_pars_vertex = `
#ifdef USE_FOG
  varying vec3 vFmWorldPos;
#endif`;

THREE.ShaderChunk.fog_vertex = `
#ifdef USE_FOG
  vec4 fmWp = vec4( transformed, 1.0 );
  #ifdef USE_INSTANCING
    fmWp = instanceMatrix * fmWp;
  #endif
  vFmWorldPos = ( modelMatrix * fmWp ).xyz;
#endif`;

THREE.ShaderChunk.fog_pars_fragment = `
#ifdef USE_FOG
  uniform vec3 fogColor;
  uniform float fogDensity;
  uniform float uFmTime, uFmSunPow, uFmSunGain, uFmFalloff, uFmFloor, uFmNoiseAmp, uFmNoiseScale, uFmStart, uFmLift;
  uniform vec3 uFmSunDir, uFmSunCol, uFmFogNear;
  uniform sampler2D uFmNoiseTex;
  uniform vec2 uFmWind;
  varying vec3 vFmWorldPos;
  ${FOG_GLSL_COMMON}
#endif`;

THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  {
    vec3 fmDir = vFmWorldPos - cameraPosition;
    float fmDist = length( fmDir );
    fmDir /= max( fmDist, 1e-4 );

    // BANDED density — domain-warped fbm dragged by the wind, plus a
    // traveling wave front. This is what turns flat haze into moving banks.
    vec2  fmP    = vFmWorldPos.xz * uFmNoiseScale;
    vec2  fmWt   = uFmWind * uFmTime * 0.25;
    float fmWarp = texture2D( uFmNoiseTex, fmP * 0.55 + fmWt * 0.35 ).b;
    vec2  fmWdir = normalize( uFmWind + vec2( 1e-4 ) );
    float fmWave = sin( dot( vFmWorldPos.xz, fmWdir ) * 0.13 - uFmTime * ( 0.3 + 0.5 * length( uFmWind ) ) );
    float fmBank = texture2D( uFmNoiseTex, fmP + fmWt + ( fmWarp - 0.5 ) * 0.45 ).r + 0.22 * fmWave;
    fmBank = smoothstep( 0.18, 0.92, fmBank );
    float fmNAmp = uFmNoiseAmp * smoothstep( ${TUNE.fog.noiseNear.toFixed(1)}, ${TUNE.fog.noiseFar.toFixed(1)}, fmDist );
    float fmRho  = fogDensity * mix( 1.0 - fmNAmp, 1.0 + fmNAmp * 1.5, fmBank );

    // the fog is SOMEWHERE: a soft start keeps the near field clean...
    float fmD2 = fmDist - uFmStart * smoothstep( 0.0, uFmStart * 1.8, fmDist );
    // ...and it hangs ALOFT: thicker up high, a readable corridor along the ground
    fmRho *= mix( 1.0, mix( 0.45, 2.4, smoothstep( -1.0, 9.0, vFmWorldPos.y ) ), uFmLift );

    // closed-form optical depth of rho0 * exp(-(y-floor)*b) along the ray
    float fmB  = uFmFalloff;
    float fmRy = fmDir.y; fmRy = ( abs(fmRy) < 1e-3 ) ? ( fmRy >= 0.0 ? 1e-3 : -1e-3 ) : fmRy;
    float fmOD = fmRho * exp( -( cameraPosition.y - uFmFloor ) * fmB )
               * ( 1.0 - exp( -fmD2 * fmRy * fmB ) ) / ( fmRy * fmB );
    float fmAmt = 1.0 - exp( -max( fmOD, 0.0 ) );

    // depth-graded fog color: near murk runs deeper, far pales into the sky
    vec3  fmFogC = mix( uFmFogNear, fogColor, smoothstep( 0.0, 0.85, fmAmt ) );
    // inscatter: fog glows toward the light source
    float fmSun  = pow( max( dot( fmDir, uFmSunDir ), 0.0 ), uFmSunPow );
    vec3  fmCol  = mix( fmFogC, uFmSunCol, fmSun * uFmSunGain );

    // silhouettes survive: geometry never quite reaches the sky's fog,
    // so stacked layers keep visible tonal steps all the way out
    fmAmt = min( fmAmt, 0.94 );

    // dither so the gradient never bands on OLED
    fmAmt += ( fmIGN( gl_FragCoord.xy ) - 0.5 ) * ${TUNE.fog.dither.toFixed(4)};

    gl_FragColor.rgb = mix( gl_FragColor.rgb, fmCol, clamp( fmAmt, 0.0, 1.0 ) );
  }
#endif`;

// wire the shared uniforms into any built-in material (and optionally mod it)
function enchant(mat, mod){
  mat.onBeforeCompile = (shader)=>{
    Object.assign(shader.uniforms, FOG_SHARED);
    if (mod) mod(shader);
  };
  mat.customProgramCacheKey = ()=> 'fm' + (mod ? mod.name || 'x' : '');
  return mat;
}

// ============================================================================
// Boot
// ============================================================================
// XR2-class devices start one tier down and at a lower DPR ceiling; the
// governor climbs within seconds if there's headroom, so quality is only
// ever traded when the frame budget actually demands it.
const IS_QUEST = /OculusBrowser|Quest/i.test(navigator.userAgent);
if (IS_QUEST){ TUNE.render.maxDPR = 1.25; TUNE.render.startTier = 2; }
const renderer = new THREE.WebGLRenderer({ antialias:false, stencil:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, TUNE.render.maxDPR));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8062ae, 0.12);

const camera = new THREE.PerspectiveCamera(TUNE.render.fov, innerWidth/innerHeight, TUNE.render.near, TUNE.render.far);
const camTarget = new THREE.Vector3(0, TUNE.camera.targetY, 0);

// toon gradient — 3 chunky steps, house standard
const gradTex = new THREE.DataTexture(new Uint8Array([70, 150, 255]), 3, 1, THREE.LuminanceFormat);
gradTex.minFilter = THREE.NearestFilter; gradTex.magFilter = THREE.NearestFilter; gradTex.needsUpdate = true;

// lights
const hemi = new THREE.HemisphereLight(0x9a6fae, 0x2c2138, 0.85); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xdcb8ea, 0.5); scene.add(moon);
const flameLight = new THREE.PointLight(0x54d6ef, 1.1, 9, 2); flameLight.position.set(0, 1.6, 0.9); scene.add(flameLight);

// ============================================================================
// SKY DOME — the whole trick, part 2.
// The horizon band is painted with the *exact same* fog color + inscatter the
// geometry fogs to, so meshes dissolve into "sky" with no findable seam.
// ============================================================================
const skyU = {
  uZen:  { value: new THREE.Color(0x6b4a86) },
  uHor:  { value: scene.fog.color },          // shared reference — always in sync
  uSunDir: FOG_SHARED.uFmSunDir,
  uSunCol: FOG_SHARED.uFmSunCol,
  uSunPow: FOG_SHARED.uFmSunPow,
  uSunGain: FOG_SHARED.uFmSunGain,
  uTime: FOG_SHARED.uFmTime,
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 uZen, uHor, uSunDir, uSunCol; uniform float uSunPow, uSunGain, uTime;
    varying vec3 vDir;
    ${FOG_GLSL_COMMON}
    void main(){
      vec3 d = normalize(vDir);
      float up = clamp(d.y, 0.0, 1.0);
      vec3 col = mix(uHor, uZen, pow(up, 0.62));
      // faint drifting wisps in the upper murk
      float w = fmFbm(d.xz / (d.y + 0.42) * 2.6 + vec2(uTime*0.02, uTime*0.013));
      col = mix(col, uHor, (1.0 - up) * 0.25 + w * 0.10 * (1.0 - up));
      // moon/sun glow blob
      float s = pow(max(dot(d, uSunDir), 0.0), uSunPow);
      col = mix(col, uSunCol, s * uSunGain);
      col += (fmIGN(gl_FragCoord.xy) - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 24, 16), skyMat);
sky.renderOrder = 1; sky.frustumCulled = false; scene.add(sky);  // after opaques: early-Z reclaims covered pixels

// ============================================================================
// TERRAIN — vertex-colored, flat clearing, winding path
// ============================================================================
const groundGeo = new THREE.PlaneGeometry(90, 90, 72, 72);
groundGeo.rotateX(-Math.PI/2);
{
  const pos = groundGeo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const cMoss  = new THREE.Color(0x44603a), cMoss2 = new THREE.Color(0x5a7350);
  const cRust  = new THREE.Color(0x6d4a3c), cPath  = new THREE.Color(0x4b3b30);
  const c = new THREE.Color();
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, terrainH(x,z));
    const n = fbmJS(x*0.22+5, z*0.22+9);
    c.copy(cMoss).lerp(cMoss2, n);
    const rust = smooth(0.62, 0.78, fbmJS(x*0.13+40, z*0.13+2));
    c.lerp(cRust, rust*0.55);
    const pz = Math.sin(x*0.16)*2.2;
    c.lerp(cPath, smooth(1.9, 0.7, Math.abs(z - pz)) * 0.8);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
  groundGeo.computeVertexNormals();
}
const groundMat = enchant(new THREE.MeshToonMaterial({ color:0xffffff, gradientMap:gradTex, vertexColors:true }));
scene.add(new THREE.Mesh(groundGeo, groundMat));

// shared instanced toon material (per-instance colors)
const instMat = enchant(new THREE.MeshToonMaterial({ color:0xffffff, gradientMap:gradTex }));

const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3();
const C = new THREE.Color();
function setInst(mesh, i, x,y,z, sx,sy,sz, ry, color){
  Q.setFromEuler(new THREE.Euler(0, ry||0, 0));
  M.compose(V.set(x,y,z), Q, S.set(sx,sy,sz));
  mesh.setMatrixAt(i, M);
  mesh.setColorAt(i, C.set(color));
}

const shadowSpots = []; // {x,z,r}

// ============================================================================
// TRUNKS — the giant fog-eaters. Far ones run out the top of frame like WoW's.
// ============================================================================
const trunkGeo = new THREE.CylinderGeometry(0.72, 1.0, 1, 9, 1, true);
trunkGeo.translate(0, 0.5, 0);
const NT = 64;
const trunks = new THREE.InstancedMesh(trunkGeo, instMat, NT);
{

// ============================================================================
// FLAMES — the "glows through the murk" cue. One additive draw call.
// Halo quads GROW with camera distance and dim, entirely in the vertex shader:
// exactly what a real light's airglow does in fog. No JS per frame.
// ============================================================================
const flameU = {
  uTime: FOG_SHARED.uFmTime,
  uGrow: { value: TUNE.flame.haloGrow },
  uFade: { value: TUNE.flame.haloFade },
};
const flameMat = new THREE.ShaderMaterial({
  uniforms: flameU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    attribute vec3 aCenter; attribute vec2 aCorner; attribute vec4 aCfg; // size, halo, seed, _
    uniform float uTime, uGrow, uFade;
    varying vec2 vUv; varying float vHalo, vDim, vSeed;
    void main(){
      vUv = aCorner; vHalo = aCfg.y; vSeed = aCfg.z;
      float d = length(aCenter - cameraPosition);
      float flick = 0.86 + 0.28 * sin(uTime*13.0 + aCfg.z*37.0) * sin(uTime*7.3 + aCfg.z*11.0);
      float size = aCfg.x * flick * mix(1.0, 1.0 + d*uGrow, aCfg.y);
      vDim = mix(1.0, 1.0/(1.0 + d*uFade*6.0) * 2.2, aCfg.y) * flick;
      vec3 cr = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
      vec3 cu = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
      vec3 wp = aCenter + cr*aCorner.x*size + cu*(aCorner.y*size + (1.0-aCfg.y)*size*0.35);
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv; varying float vHalo, vDim, vSeed;
    void main(){
      float r = length(vUv);
      float core = pow(max(1.0 - r, 0.0), 2.2);
      float halo = pow(max(1.0 - r, 0.0), 1.5);
      float a = mix(core, halo*0.30, vHalo) * vDim;
      vec3 col = mix(vec3(0.72, 0.98, 1.05), vec3(0.22, 0.78, 0.92), mix(r, 0.5+r*0.5, vHalo));
      gl_FragColor = vec4(col * a, a);
    }`,
});
{
  const quads = [];
  TUNE.flames.forEach((f, fi)=>{
    quads.push({c:[f.x,f.y,f.z],       s:TUNE.flame.coreSize, halo:0, seed:fi*3+1});
    quads.push({c:[f.x,f.y+0.06,f.z],  s:TUNE.flame.haloSize, halo:1, seed:fi*3+2});
  });
  const n = quads.length;
  const pos = new Float32Array(n*4*3), ctr = new Float32Array(n*4*3);
  const cor = new Float32Array(n*4*2), cfg = new Float32Array(n*4*4);
  const idx = [];
  const CORN = [[-1,-1],[1,-1],[1,1],[-1,1]];
  quads.forEach((q,qi)=>{
    for (let v=0;v<4;v++){
      const o = qi*4+v;
      ctr.set(q.c, o*3);
      cor.set(CORN[v], o*2);
      cfg.set([q.s, q.halo, q.seed, 0], o*4);
    }
    const b = qi*4; idx.push(b,b+1,b+2, b,b+2,b+3);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); // unused, required
  g.setAttribute('aCenter', new THREE.BufferAttribute(ctr,3));
  g.setAttribute('aCorner', new THREE.BufferAttribute(cor,2));
  g.setAttribute('aCfg',    new THREE.BufferAttribute(cfg,4));
  g.setIndex(idx);
  const flames = new THREE.Mesh(g, flameMat);
  flames.frustumCulled = false; flames.renderOrder = 5;
  scene.add(flames);
}

// ============================================================================
// FOG SHEETS v2 — the moving fog is geometry, and now it has BODY.
// Each bank is its own mesh (three.js depth-sorts transparents correctly),
// drifting on the CPU (26 position sets/frame — nothing). The sprite shader
// does the cloud work: noise-eroded silhouette with a near-opaque core,
// lit tops / dark bellies, moon glow-through, and the same atmospheric
// wash the trees get so banks sit IN the scene instead of on top of it.
// ============================================================================
const sheetShared = {
  uColLit:  { value: new THREE.Color(0xe6c8ee) },
  uColCore: { value: new THREE.Color(0x8a5f96) },
  uFogC:    { value: scene.fog.color },   // same Color object — synced for free
  uFogD:    { value: 0.12 },
  uFogS:    { value: 8.0 },
};
const bankAmt = { value: 1 }, mistAmt = { value: 1 };
const sheetGeo = new THREE.PlaneGeometry(1, 1);

function sheetMaterial(horizontal){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: FOG_SHARED.uFmTime, uWind: FOG_SHARED.uFmWind,
      uSunDir: FOG_SHARED.uFmSunDir, uSunCol: FOG_SHARED.uFmSunCol,
      uColLit: sheetShared.uColLit, uColCore: sheetShared.uColCore,
      uFogC: sheetShared.uFogC, uFogD: sheetShared.uFogD, uFogS: sheetShared.uFogS,
      uAmt: horizontal ? mistAmt : bankAmt,
      uSeed: { value: 0 }, uOpq: { value: 0.85 },
      uDim: { value: new THREE.Vector2(1, 1) }, uChurn: { value: 1 },
      uNz: { value: NOISE_TEX },
    },
    transparent: true, depthWrite: false, fog: false,
    defines: horizontal ? { HORIZONTAL: 1 } : {},
    vertexShader: `
      uniform vec3 uSunDir;
      varying vec2 vUv; varying vec3 vWp; varying float vDist; varying float vSun;
      varying vec2 vView;
      void main(){
        vUv = uv;
        vec4 wp4 = modelMatrix * vec4( position, 1.0 );
        vWp = wp4.xyz;
        vec3 toCam = cameraPosition - wp4.xyz;
        vDist = length( toCam );
        // banks between you and the moon catch its glow
        vSun = pow( max( dot( -normalize( toCam ), uSunDir ), 0.0 ), 3.0 );
        // camera offset in the card's own frame — drives interior parallax
        vec3 rgt = normalize( modelMatrix[0].xyz );
        vec3 upv = normalize( modelMatrix[1].xyz );
        vView = vec2( dot( toCam, rgt ), dot( toCam, upv ) ) / max( vDist, 0.001 );
        gl_Position = projectionMatrix * viewMatrix * wp4;
      }`,
    fragmentShader: `
      uniform float uTime, uAmt, uFogD, uFogS, uSeed, uOpq, uChurn;
      uniform vec2 uWind, uDim;
      uniform vec3 uColLit, uColCore, uFogC, uSunCol;
      varying vec2 vUv; varying vec3 vWp; varying float vDist; varying float vSun;
      varying vec2 vView;
      float h2(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
      float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x), mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x), f.y); }
      void main(){
        float amp = uAmt * smoothstep( 0.55, 2.4, vDist );
        if ( amp < 0.004 ) discard;

        // MIST, not clouds. No silhouette, no rim, no core — a boundless,
        // low-contrast density field. The only mask is the quad border,
        // killed over nearly half the card, so no contour ever closes.
        vec2 e = smoothstep( vec2( 0.0 ), vec2( 0.45 ), vUv )
               * ( vec2( 1.0 ) - smoothstep( vec2( 0.55 ), vec2( 1.0 ), vUv ) );
        float mask = e.x * e.y;

        // huge, horizontally stratified features; lazy churn; faint parallax
        vec2 base = ( vUv - 0.5 ) * uDim * 0.013 + uSeed;
        base.y *= 2.4;
        float t = uTime * uChurn * 0.6;
        vec2 pv = vView * 0.06;
        float n = 0.72 * texture2D( uNz, base            + vec2( 0.020, 0.006 ) * t ).r
                + 0.28 * texture2D( uNz, base * 2.0 + pv + vec2( -0.012, 0.014 ) * t + 0.43 ).g;

        float a = smoothstep( 0.20, 0.95, n );
        #ifndef HORIZONTAL
          a *= smoothstep( 0.0, 0.22, vUv.y );                  // soft floating underside
          a *= 1.0 - smoothstep( 0.55, 1.0, vUv.y ) * 0.45;     // thins toward the crown
        #endif
        a *= mask;

        // near-flat luminance: mist is always a touch lighter than the murk
        vec3 col = mix( uColCore, uColLit, n );
        col += uSunCol * vSun * 0.35;

        // brazier glow soaks in
        float fg = exp( -length( vWp - vec3( ${TUNE.flames[0].x}, ${TUNE.flames[0].y}, ${TUNE.flames[0].z} ) ) * 0.55 )
                 + exp( -length( vWp - vec3( ${TUNE.flames[1].x}, ${TUNE.flames[1].y}, ${TUNE.flames[1].z} ) ) * 0.55 );
        col = mix( col, vec3( 0.45, 0.95, 1.0 ), clamp( fg * 0.8, 0.0, 0.5 ) );

        // atmospheric wash + dither
        float fd = vDist - uFogS * smoothstep( 0.0, uFogS * 1.8, vDist );
        col = mix( col, uFogC, 1.0 - exp( -fd * uFogD * 0.9 ) );
        a += ( h2( gl_FragCoord.xy * 0.7 ) - 0.5 ) * 0.03;

        gl_FragColor = vec4( col, clamp( a, 0.0, 1.0 ) * amp * uOpq );
      }`,
  });
}

const sheets = [];
function addSheet(o){
  const mat = sheetMaterial(!!o.horizontal);
  mat.uniforms.uSeed.value = rng() * 43.7;
  mat.uniforms.uOpq.value = o.opq;
  mat.uniforms.uDim.value.set(o.w, o.h);
  mat.uniforms.uChurn.value = o.churn || 1.0;
  const m = new THREE.Mesh(sheetGeo, mat);
  m.scale.set(o.w, o.h, 1);
  if (o.horizontal) m.rotation.x = -Math.PI / 2;
  m.renderOrder = o.horizontal ? 2 : 3;
  m.frustumCulled = true;   // real positions → let the frustum do its job
  scene.add(m);
  o.mesh = m;
  sheets.push(o);
}
// wrapping banks — the weather that rolls through
for (let i = 0; i < TUNE.sheets.banks; i++){
  const b = TUNE.sheets.bankBox;
  addSheet({ w: rr(26, 48), h: rr(4, 7.5), y: rr(3.4, 5.6), opq: rr(0.38, 0.60),
             px: rng() * b, pz: rng() * b, box: b, rate: rr(0.8, 1.7), churn: rr(0.7, 1.4) });
}
// fixed oscillators — art-directed banks that guarantee the money shots
[ { ax:  0.5, az: -13.5, w: 42, h: 8.5, y: 4.0, opq: 0.52 },
  { ax: -9.5, az:   4.0, w: 34, h: 7.0, y: 3.6, opq: 0.48 },
  { ax: 10.5, az:  -2.5, w: 36, h: 7.5, y: 3.8, opq: 0.48 },
  { ax:  3.0, az:  12.5, w: 38, h: 8.0, y: 3.7, opq: 0.50 },
].forEach(f => {
  const j = rr(-0.25, 0.25);
  addSheet(Object.assign({ fixed: true, dx: Math.cos(0.38 + j), dz: Math.sin(0.38 + j),
                           amp: rr(3, 5.5), om: rr(0.05, 0.09), phase: rng() * 6.283, churn: 0.9 }, f));
});
// hero banks — two that sail straight through the clearing, and through YOU
for (let i = 0; i < 2; i++){
  addSheet({ hero: true, w: 34, h: 9, y: 2.6, opq: 0.70, churn: 1.2 });
}
// backdrop layer — huge, slow, far: the churning wall behind the trunks
for (let i = 0; i < 4; i++){
  const a = (i / 4) * 6.283 + rr(-0.4, 0.4), rad = rr(30, 40);
  addSheet({ fixed: true, ax: Math.cos(a) * rad, az: Math.sin(a) * rad,
             dx: Math.cos(a + 1.571), dz: Math.sin(a + 1.571),
             w: rr(50, 70), h: rr(11, 16), y: rr(5.0, 7.0), opq: 0.55,
             amp: rr(6, 9), om: rr(0.02, 0.04), phase: rng() * 6.283, churn: 0.45 });
}
// ground mist pads
for (let i = 0; i < TUNE.sheets.mist; i++){
  const b = TUNE.sheets.mistBox, s = rr(16, 28);
  addSheet({ horizontal: true, w: s, h: s, y: rr(0.45, 1.1), opq: rr(0.22, 0.38),
             px: rng() * b, pz: rng() * b, box: b, rate: rr(0.5, 1.2), churn: rr(0.5, 1.0) });
}
const wrapC = (v, box) => ((v % box) + box) % box - box * 0.5;

// ============================================================================
// CAMERA MIST SHELLS — three full-frame layers parented to the camera at
// fixed depths, so mist can never "stop" short of the lens. The geometry
// rides with you, but the noise is sampled in WORLD space: the pattern
// belongs to the forest and slides across the screen as you move.
// Fog you pass THROUGH, not a screen filter.
// ============================================================================
scene.add(camera);
const shells = [];
{
  const defs = [
    { d: 12.0, a: 0.20, s: 0.0125, churn: 0.55, order: 7, dr: [ 0.018, -0.004 ], mw: 0.55 },
    { d:  6.0, a: 0.18, s: 0.0180, churn: 0.75, order: 8, dr: [ -0.026, 0.007 ], mw: 0.42 },
    { d:  2.6, a: 0.15, s: 0.0250, churn: 1.00, order: 9, dr: [ 0.042,  0.010 ], mw: 0.30 },
  ];
  for (let i = 0; i < defs.length; i++){
    const def = defs[i];
    const mat = new THREE.ShaderMaterial({
      precision: 'mediump',
      uniforms: {
        uTime: FOG_SHARED.uFmTime, uWind: FOG_SHARED.uFmWind,
        uSunDir: FOG_SHARED.uFmSunDir, uSunCol: FOG_SHARED.uFmSunCol,
        uColLit: sheetShared.uColLit, uColCore: sheetShared.uColCore,
        uFogC: sheetShared.uFogC, uFogD: sheetShared.uFogD,
        uAmt: bankAmt, uA: { value: def.a }, uScale: { value: def.s },
        uD: { value: def.d }, uChurn: { value: def.churn },
        uOff: { value: new THREE.Vector2(0, 0) },
        uPlane: { value: new THREE.Vector2(1, 1) },
        uEnv: { value: 0 }, uMixW: { value: def.mw },
        uNz: { value: NOISE_TEX },
      },
      transparent: true, depthWrite: false, fog: false,
      vertexShader: `
        uniform vec3 uSunDir;
        varying vec3 vWp; varying float vSun; varying vec2 vLp;
        void main(){
          vLp = uv - 0.5;
          vec4 wp4 = modelMatrix * vec4( position, 1.0 );
          vWp = wp4.xyz;
          vSun = pow( max( dot( normalize( wp4.xyz - cameraPosition ), uSunDir ), 0.0 ), 3.0 );
          gl_Position = projectionMatrix * viewMatrix * wp4;
        }`,
      fragmentShader: `
        uniform float uTime, uAmt, uA, uScale, uD, uChurn, uFogD, uEnv, uMixW;
        uniform vec2 uWind, uOff, uPlane;
        uniform vec3 uColLit, uColCore, uFogC, uSunCol;
        uniform sampler2D uNz;
        varying vec3 vWp; varying float vSun; varying vec2 vLp;
        float h2(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
        float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x), mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x), f.y); }
        void main(){
          if ( uAmt < 0.02 ) discard;
          // two fields blended: a world-anchored slice (belongs to the
          // forest) + a per-layer SCREEN-space drift (guarantees motion at
          // frame center even under a pure orbit, where world sampling has
          // a fixed point at the look target)
          float t = uTime * uChurn;
          vec2 w = uWind * t * 0.09;
          vec2 pw = vWp.xz * uScale + vWp.y * vec2( 0.33, 0.19 ) * uScale;
          vec2 ps = vLp * uPlane * uScale * 0.9 + uOff;
          // ONE body tap on a velocity-blended coordinate: reads as a single
          // field whose motion sits between world and screen — same look,
          // a third fewer taps on the largest fragment population on screen
          vec2 pm = mix( ps + 0.37, pw + w, uMixW );
          float nB = texture2D( uNz, pm ).r;
          // billow channel — the wisps you actually SEE slipping past
          float nF = texture2D( uNz, ps * 2.6 + uOff * 1.8 + 0.71 ).g;
          float n = nB + ( nF - 0.5 ) * ( 0.10 + uEnv * 0.28 );
          float a = smoothstep( 0.24 - uEnv * 0.14, 0.92 - uEnv * 0.28, n ) * uA * uAmt;
          vec3 col = mix( uColCore, uColLit, n );
          col += uSunCol * vSun * 0.35;
          float fg = exp( -length( vWp - vec3( ${TUNE.flames[0].x}, ${TUNE.flames[0].y}, ${TUNE.flames[0].z} ) ) * 0.55 )
                   + exp( -length( vWp - vec3( ${TUNE.flames[1].x}, ${TUNE.flames[1].y}, ${TUNE.flames[1].z} ) ) * 0.55 );
          col = mix( col, vec3( 0.45, 0.95, 1.0 ), clamp( fg * 0.8, 0.0, 0.5 ) );
          col = mix( col, uFogC, 1.0 - exp( -uD * uFogD * 0.9 ) );
          a += ( h2( gl_FragCoord.xy * 0.7 + uD ) - 0.5 ) * 0.02;
          gl_FragColor = vec4( col, clamp( a, 0.0, 1.0 ) );
        }`,
    });
    const m = new THREE.Mesh(sheetGeo, mat);
    m.position.set(0, 0, -def.d);
    m.renderOrder = def.order; m.frustumCulled = false;
    camera.add(m);
    shells.push({ mesh: m, d: def.d, a0: def.a, dr0: def.dr[0], dr1: def.dr[1], ox: rng() * 7, oy: rng() * 7 });
  }
}
function sizeShells(){
  const th = Math.tan( camera.fov * Math.PI / 360 );
  for (let i = 0; i < shells.length; i++){
    const s = shells[i];
    const sx = 2 * s.d * th * camera.aspect * 1.4, sy = 2 * s.d * th * 1.4;
    s.mesh.scale.set( sx, sy, 1 );
    s.mesh.material.uniforms.uPlane.value.set( sx, sy );
  }
}
sizeShells();

// ============================================================================
// THE VEIL — what being INSIDE a bank looks like. A fullscreen layer that
// fades up as the camera enters a sheet's volume, while the world's fog
// start collapses and density surges. Approach → envelop → clear.
// ============================================================================
let veil = 0;
const veilU = { uVeil: { value: 0 } };
const veilMesh = (() => {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: FOG_SHARED.uFmTime, uWind: FOG_SHARED.uFmWind,
                uVeil: veilU.uVeil, uColA: sheetShared.uColCore, uColB: sheetShared.uColLit },
    transparent: true, depthTest: false, depthWrite: false, fog: false,
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }`,
    fragmentShader: `
      uniform float uTime, uVeil;
      uniform vec2 uWind;
      uniform vec3 uColA, uColB;
      varying vec2 vUv;
      float h2(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
      float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h2(i),h2(i+vec2(1.,0.)),f.x), mix(h2(i+vec2(0.,1.)),h2(i+vec2(1.,1.)),f.x), f.y); }
      void main(){
        vec2 p = vUv * vec2( 2.6, 1.7 );
        float t = uTime * ( 0.6 + 0.6 * length( uWind ) );
        float warp = n2( p * 0.7 + vec2( 0.05, 0.02 ) * t );
        float n = 0.6 * n2( p + vec2( 0.16, 0.05 ) * t + ( warp - 0.5 ) * 1.3 )
                + 0.4 * n2( p * 2.3 + vec2( -0.09, 0.12 ) * t );
        float a = uVeil * ( 0.30 + 0.55 * smoothstep( 0.25, 0.90, n ) );
        a += ( h2( gl_FragCoord.xy * 0.7 ) - 0.5 ) * 0.03;
        gl_FragColor = vec4( mix( uColA, uColB, n ), clamp( a, 0.0, 1.0 ) );
      }`,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  m.frustumCulled = false; m.renderOrder = 50; m.visible = false;
  scene.add(m);
  return m;
})();

// ============================================================================
// MOTES — drifting air particles. One Points draw call, camera-wrapped volume.
// ============================================================================
const moteU = { uTime: FOG_SHARED.uFmTime, uAmt: { value: 1 }, uBox: { value: TUNE.motes.box }, uSize: { value: TUNE.motes.size * Math.min(window.devicePixelRatio, TUNE.render.maxDPR) } };
const moteMat = new THREE.ShaderMaterial({
  uniforms: moteU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    attribute vec3 aRnd;
    uniform float uTime, uBox, uSize, uAmt;
    varying float vA;
    void main(){
      vec3 drift = vec3( sin(uTime*0.13 + aRnd.x*40.0)*1.5, uTime*${TUNE.motes.drift.toFixed(2)} + sin(uTime*0.21+aRnd.y*30.0)*0.6, cos(uTime*0.11 + aRnd.z*50.0)*1.5 );
      vec3 p = mod( aRnd*uBox + drift - cameraPosition, vec3(uBox) ) + cameraPosition - uBox*0.5;
      vec4 mv = viewMatrix * vec4(p, 1.0);
      float d = -mv.z;
      float edge = smoothstep(uBox*0.5, uBox*0.32, distance(p, cameraPosition));
      vA = uAmt * edge * (0.35 + 0.65*fract(aRnd.x*91.7)) * (0.6 + 0.4*sin(uTime*2.0 + aRnd.y*80.0));
      gl_PointSize = uSize * (0.4 + 0.6*fract(aRnd.z*77.3)) / max(d, 0.5);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      float r = length(gl_PointCoord - 0.5) * 2.0;
      float a = pow(max(1.0 - r, 0.0), 1.8) * vA * 0.8;
      gl_FragColor = vec4(vec3(1.0, 0.96, 1.0) * a, a);
    }`,
});
{
  const n = TUNE.motes.count;
  const rnd = new Float32Array(n*3);
  for (let i=0;i<n*3;i++) rnd[i] = rng();
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3),3));
  g.setAttribute('aRnd', new THREE.BufferAttribute(rnd,3));
  const motes = new THREE.Points(g, moteMat);
  motes.frustumCulled = false; motes.renderOrder = 4;
  scene.add(motes);
}

// ============================================================================
// PRESETS — everything crossfades; nothing snaps
// ============================================================================
function unpack(p){
  return {
    fogC: new THREE.Color(p.fogC), fogNearC: new THREE.Color(p.fogNear), sunC: new THREE.Color(p.sunC), zenC: new THREE.Color(p.zenC),
    hemiSky: new THREE.Color(p.hemiSky), hemiGnd: new THREE.Color(p.hemiGnd), dirC: new THREE.Color(p.dirC),
    sunDir: new THREE.Vector3(...p.sunDir).normalize(),
    density: p.density, falloff: p.falloff, floor: p.floor, start: p.start, lift: p.lift, noiseAmp: p.noiseAmp,
    windX: p.windX, windY: p.windY, sunPow: p.sunPow, sunGain: p.sunGain,
    hemiI: p.hemiI, dirI: p.dirI, motes: p.motes, banks: p.banks, mist: p.mist,
  };
}
const LERP_KEYS = ['density','falloff','floor','start','lift','noiseAmp','windX','windY','sunPow','sunGain','hemiI','dirI','motes','banks','mist'];
const cur = unpack(TUNE.presets.valsharah);
let target = unpack(TUNE.presets.valsharah);
let activePreset = 'valsharah';

function setPreset(name){
  if (!TUNE.presets[name]) return;
  activePreset = name;
  target = unpack(TUNE.presets[name]);
  document.getElementById('forecast').textContent = TUNE.presets[name].forecast;
  document.querySelectorAll('.pill').forEach(b => b.classList.toggle('on', b.dataset.p === name));
}
document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', ()=> setPreset(b.dataset.p)));

// ============================================================================
// INPUT — drag orbit with inertia, auto-drift when idle
// ============================================================================
let yaw = TUNE.camera.yaw0, pitch = TUNE.camera.pitch0, yawVel = 0, pitchVel = 0;
let dragging = false, lastX = 0, lastY = 0, idleT = 0;
const cnv = renderer.domElement;
cnv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; idleT = 0;
  document.getElementById('hint').style.opacity = 0; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
  yawVel  = -dx * TUNE.camera.dragSens * 60;
  pitchVel = dy * TUNE.camera.dragSens * 60;
  idleT = 0;
});
window.addEventListener('pointerup', ()=> dragging = false);
window.addEventListener('pointercancel', ()=> dragging = false);

// ============================================================================
// LOOP
// ============================================================================
const clock = new THREE.Clock();
let simT = 0;
let perfEMA = 16.6, perfAcc = 0;
const perfEl = document.getElementById('perf');
const whiteC = new THREE.Color(1,1,1);
const fogPush = new THREE.Color();
let hidden = false;
document.addEventListener('visibilitychange', ()=> { hidden = document.hidden; if (!hidden) clock.getDelta(); });
setTimeout(()=> { document.getElementById('hint').style.opacity = 0; }, 4500);


// ============================================================================
// GLOW — the 2006 special: full-scene soft bloom. Render to a target, blur a
// quarter-res copy, screen-blend it back over everything. Lights halate, fog
// turns luminous, polygon edges stop being razor-sharp — the whole frame
// finally lives in ONE atmosphere. Three fullscreen passes, quarter-res blur.
// ============================================================================
const post = (() => {
  const qw = () => Math.max(1, (renderer.domElement.width  >> 2)),
        qh = () => Math.max(1, (renderer.domElement.height >> 2));
  let iScale = 1.0;
  const rtScene = new THREE.WebGLRenderTarget(renderer.domElement.width, renderer.domElement.height, { stencilBuffer: false });
  const rtA = new THREE.WebGLRenderTarget(qw(), qh(), { depthBuffer: false, stencilBuffer: false });
  const rtB = new THREE.WebGLRenderTarget(qw(), qh(), { depthBuffer: false, stencilBuffer: false });
  rtScene.texture.generateMipmaps = rtA.texture.generateMipmaps = rtB.texture.generateMipmaps = false;
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const vs = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }`;
  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2() } },
    depthTest: false, depthWrite: false, vertexShader: vs,
    fragmentShader: `varying vec2 vUv; uniform sampler2D tD; uniform vec2 uDir;
      void main(){
        vec4 c = texture2D( tD, vUv ) * 0.227027;
        c += ( texture2D( tD, vUv + uDir * 1.3846 ) + texture2D( tD, vUv - uDir * 1.3846 ) ) * 0.3162162;
        c += ( texture2D( tD, vUv + uDir * 3.2308 ) + texture2D( tD, vUv - uDir * 3.2308 ) ) * 0.0702703;
        gl_FragColor = c;
      }`,
  });
  const compMat = new THREE.ShaderMaterial({
    uniforms: { tBase: { value: rtScene.texture }, tGlow: { value: rtB.texture }, uAmt: { value: TUNE.render.glow } },
    depthTest: false, depthWrite: false, vertexShader: vs,
    fragmentShader: `varying vec2 vUv; uniform sampler2D tBase, tGlow; uniform float uAmt;
      void main(){
        vec3 b = texture2D( tBase, vUv ).rgb;
        vec3 g = texture2D( tGlow, vUv ).rgb;
        gl_FragColor = vec4( 1.0 - ( 1.0 - b ) * ( 1.0 - g * uAmt ), 1.0 );
      }`,
  });
  const scn = new THREE.Scene();
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blurMat);
  scn.add(quad);
  function pass(mat, target){ quad.material = mat; renderer.setRenderTarget(target); renderer.render(scn, cam); }
  function render(){
    renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
    blurMat.uniforms.tD.value = rtScene.texture; blurMat.uniforms.uDir.value.set(1 / rtA.width, 0); pass(blurMat, rtA);
    blurMat.uniforms.tD.value = rtA.texture;     blurMat.uniforms.uDir.value.set(0, 1 / rtB.height); pass(blurMat, rtB);
    renderer.setRenderTarget(null); pass(compMat, null);
  }
  function resize(){
    rtScene.setSize(Math.max(1, Math.round(renderer.domElement.width * iScale)),
                    Math.max(1, Math.round(renderer.domElement.height * iScale)));
    rtA.setSize(Math.max(1, rtScene.width >> 2), Math.max(1, rtScene.height >> 2));
    rtB.setSize(Math.max(1, rtScene.width >> 2), Math.max(1, rtScene.height >> 2));
  }
  function setScale(s){ if (s !== iScale){ iScale = s; resize(); } }
  return { render, resize, setScale };
})();

// ============================================================================
// QUALITY GOVERNOR — three tiers, hysteresis, zero drama. Slow frames step
// down (internal res, far shell, sheet cull radius); fast frames step back.
// ============================================================================
const TIERS = [
  { tag: 'S',  scale: 1.00, farCull: 3600, shells: 3 },
  { tag: 'A',  scale: 0.85, farCull: 3025, shells: 3 },
  { tag: 'B',  scale: 0.70, farCull: 2116, shells: 2 },
];
let qTier = -1, qFarCull = 3025, qHot = 0, qCold = 0, qLock = 0;
function applyTier(i){
  qTier = i; const q = TIERS[i];
  post.setScale(q.scale);
  qFarCull = q.farCull;
  for (let s = 0; s < shells.length; s++) shells[s].mesh.visible = s >= shells.length - q.shells;
}
applyTier(TUNE.render.startTier);
function govern(ms, dt){
  qLock -= dt;
  if (ms > 19) { qHot += dt; qCold = 0; } else if (ms < 11.5) { qCold += dt; qHot = 0; } else { qHot = qCold = 0; }
  if (qLock <= 0 && qHot > 1.5 && qTier < TIERS.length - 1){ applyTier(qTier + 1); qHot = 0; qLock = 3; }
  if (qLock <= 0 && qCold > 5 && qTier > 0){ applyTier(qTier - 1); qCold = 0; qLock = 3; }
}

function frame(){
  requestAnimationFrame(frame);
  if (hidden) return;
  const t0 = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  simT += dt;
  FOG_SHARED.uFmTime.value = simT;

  // ---- preset crossfade
  const k = 1 - Math.exp(-dt * TUNE.lerpRate);
  cur.fogC.lerp(target.fogC, k); cur.fogNearC.lerp(target.fogNearC, k); cur.sunC.lerp(target.sunC, k); cur.zenC.lerp(target.zenC, k);
  cur.hemiSky.lerp(target.hemiSky, k); cur.hemiGnd.lerp(target.hemiGnd, k); cur.dirC.lerp(target.dirC, k);
  cur.sunDir.lerp(target.sunDir, k).normalize();
  for (let i=0;i<LERP_KEYS.length;i++){ const key = LERP_KEYS[i];
    cur[key] += (target[key] - cur[key]) * k; }


  // ---- push state to GPU
  fogPush.copy(cur.fogC);
  scene.fog.color.copy(fogPush);
  scene.fog.density = cur.density;
  FOG_SHARED.uFmSunDir.value.copy(cur.sunDir);
  FOG_SHARED.uFmSunCol.value.copy(cur.sunC);
  FOG_SHARED.uFmSunPow.value = cur.sunPow;
  FOG_SHARED.uFmSunGain.value = cur.sunGain;
  FOG_SHARED.uFmFalloff.value = cur.falloff;
  FOG_SHARED.uFmFloor.value = cur.floor;
  FOG_SHARED.uFmStart.value = cur.start;
  FOG_SHARED.uFmLift.value = cur.lift;
  FOG_SHARED.uFmNoiseAmp.value = cur.noiseAmp;
  FOG_SHARED.uFmWind.value.set(cur.windX, cur.windY);
  FOG_SHARED.uFmFogNear.value.copy(cur.fogNearC);
  bankAmt.value = cur.banks; mistAmt.value = cur.mist;
  let imm = 0;
  sheetShared.uFogD.value = cur.density * 0.9;
  sheetShared.uFogS.value = cur.start;
  sheetShared.uColLit.value.copy(fogPush).lerp(whiteC, 0.22);
  sheetShared.uColCore.value.copy(fogPush).multiplyScalar(0.86);
  let env = 0, envDx = 1, envDz = 0;
  for (let i = 0; i < sheets.length; i++){
    const s = sheets[i], m = s.mesh;
    m.visible = (s.horizontal ? cur.mist : cur.banks) > 0.02;
    if (!m.visible) continue;
    let x, z;
    if (s.fixed){
      const o = Math.sin(simT * s.om + s.phase) * s.amp;
      x = s.ax + s.dx * o; z = s.az + s.dz * o;
    } else if (s.hero){
      if (s.prog === undefined || s.prog >= 60){
        const wl = Math.hypot(cur.windX, cur.windY) || 1;
        s.dx = cur.windX / wl; s.dz = cur.windY / wl;
        const latCam = -camera.position.x * s.dz + camera.position.z * s.dx;
        s.lat = Math.max(-11, Math.min(11, latCam + rr(-2, 2)));
        s.spd = rr(1.5, 2.1);
        s.ex = -s.dx * 30 - s.dz * s.lat;
        s.ez = -s.dz * 30 + s.dx * s.lat;
        s.prog = (s.prog === undefined) ? rr(0, 50) : 0;
      }
      s.prog += s.spd * dt;
      x = s.ex + s.dx * s.prog; z = s.ez + s.dz * s.prog;
      // envelopment: bank plane sweeping across the camera fogs the lens
      const rel = (camera.position.x - x) * s.dx + (camera.position.z - z) * s.dz;
      const lt  = -(camera.position.x - x) * s.dz + (camera.position.z - z) * s.dx;
      const e = smooth(4.5, 0.6, Math.abs(rel)) * smooth(s.w * 0.55, s.w * 0.30, Math.abs(lt));
      if (e > env){ env = e; envDx = s.dx; envDz = s.dz; }
    } else {
      s.px += cur.windX * s.rate * dt; s.pz += cur.windY * s.rate * dt;
      x = wrapC(s.px, s.box); z = wrapC(s.pz, s.box);
    }
    m.position.set(x, s.y, z);
    if (!s.horizontal){
      m.rotation.y = Math.atan2(camera.position.x - x, camera.position.z - z);
      const rad = Math.hypot(camera.position.x - x, camera.position.z - z) / (s.w * 0.30);
      const ver = Math.abs(camera.position.y - s.y) / (s.h * 0.55);
      const tt = 1 - Math.max(rad, ver);
      if (tt > 0) imm += tt * tt * s.opq;
    }
  }
  // ---- envelop: veil up, fog start collapses, density surges
  const veilTarget = Math.min(0.8, smooth(0.10, 0.75, imm)) * Math.max(cur.banks, cur.mist * 0.4);
  veil += (veilTarget - veil) * (1 - Math.exp(-dt * 3.5));
  veilU.uVeil.value = veil;
  veilMesh.visible = veil > 0.004;
  scene.fog.density = cur.density * (1 + 0.45 * veil);
  FOG_SHARED.uFmStart.value = cur.start * (1 - 0.85 * veil);
  sheetShared.uFogS.value = FOG_SHARED.uFmStart.value;
  skyU.uZen.value.copy(cur.zenC);

  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd);
  hemi.intensity = cur.hemiI;
  moon.color.copy(cur.dirC); moon.intensity = cur.dirI;
  moon.position.copy(cur.sunDir).multiplyScalar(40);
  flameLight.intensity = 0.9 + 0.35 * Math.sin(simT * 11.0) * Math.sin(simT * 6.3);

  moteU.uAmt.value = cur.motes;

  // ---- camera
  idleT += dt;
  const damp = Math.exp(-dt * TUNE.camera.damp);
  yawVel *= damp; pitchVel *= damp;
  if (!dragging && idleT > TUNE.camera.idleAfter) yaw += TUNE.camera.idleDrift * dt;
  yaw += yawVel * dt * 10; pitch += pitchVel * dt * 10;
  pitch = Math.max(TUNE.camera.pitchMin, Math.min(TUNE.camera.pitchMax, pitch));
  const cr = TUNE.camera.radius;
  camera.position.set(Math.sin(yaw) * cr, TUNE.camera.height + Math.sin(pitch) * 3.2, Math.cos(yaw) * cr);
  camera.lookAt(camTarget);
  sky.position.copy(camera.position);

  post.render();

  // ---- perf chip
  perfEMA += ((performance.now() - t0) - perfEMA) * 0.06;
  govern(perfEMA, dt);
  perfAcc += dt;
  if (perfAcc > 0.25){
    perfAcc = 0;
    perfEl.textContent = perfEMA.toFixed(1) + ' ms · ' + renderer.info.render.calls + ' dc · ' + TIERS[qTier].tag;
  }
}

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, TUNE.render.maxDPR));
  moteU.uSize.value = TUNE.motes.size * Math.min(window.devicePixelRatio, TUNE.render.maxDPR);
  sizeShells();
  post.resize();
});

frame();
</script>
</body>
</html>
